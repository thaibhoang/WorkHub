[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

wh-core = { path = "crates/wh-core" }
wh-eventstore = { path = "crates/wh-eventstore" }
wh-metrics = { path = "crates/wh-metrics" }
wh-runner = { path = "crates/wh-runner" }
wh-factory = { path = "crates/wh-factory" }
wh-foreman = { path = "crates/wh-foreman" }
wh-api = { path = "crates/wh-api" }
wh-scorer = { path = "crates/wh-scorer" }
wh-improver = { path = "crates/wh-improver" }
wh-bench = { path = "crates/wh-bench" }
wh-github = { path = "crates/wh-github" }
