# -------------------------------------------------------
# WorkHub — workhub.buihoangthai.com
# -------------------------------------------------------
# The app is a separate compose project (~/workhub) joined to app_network as
# host "workhub". proxy_pass goes through a variable + Docker's resolver so
# nginx still starts (and the other sites keep working) when WorkHub is down.

# Behind Cloudflare: the visitor's IP (login throttling) is CF-Connecting-IP.
map $http_cf_connecting_ip $workhub_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name workhub.buihoangthai.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $workhub http://workhub:7070;
    client_max_body_size 2m;

    # Live event stream (SSE): no buffering, long-lived.
    location /api/events/stream {
        proxy_pass $workhub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $workhub_client_ip;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $workhub;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $workhub_client_ip;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
