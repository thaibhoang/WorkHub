services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: workhub
      POSTGRES_DB: workhub
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
