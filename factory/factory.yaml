# WorkHub's own factory (dogfooding). Edit prompts/policies here; every change
# produces a new factory_version so before/after metrics can be compared.
#
# Pipeline (after Addy Osmani's agent-skills, trimmed to three sessions):
#   spec (Define + Plan, human gate) -> implement (Build) -> code_review
#   (Review + Verify, rework loop) -> ship gate -> PR.
# Every session costs ~30k context tokens before it does anything, and every
# stage re-reads the code it needs, so the pipeline stays at three stages: the
# old triage and verify stages were folded into spec and code_review.
name: workhub-dev
repo: ..
base_ref: main
max_rework_loops: 2

# Every task gets its own migrated database (`wh_task_*`) as DATABASE_URL, so agents
# can run tests and `wh` without touching the live one. The variable must be set for
# the WorkHub process (.env), or tasks block.
task_database:
  admin_url_env: WH_AGENT_DB_ADMIN_URL

defaults:
  model: claude-sonnet-5-5
  budget_usd: 1.0
  timeout_min: 30
  # A retry re-runs a whole session from scratch; one is enough for a timeout.
  # Usage-limit failures are never retried.
  max_retries: 1
  permission_mode: acceptEdits
  # Only the built-in tools the stages use. Each tool definition is resent on
  # every turn; the default set (subagents, cron, web, notebooks, ...) costs
  # thousands of tokens per turn and lets an agent fan out into subagents.
  tools: [Bash, Read, Edit, Write]
  # No `cargo fmt`: the codebase is not rustfmt-formatted, so it would rewrite
  # whole files and bury the real change in the diff.
  allowed_tools:
    - "Bash(cargo build:*)"
    - "Bash(cargo test:*)"
    - "Bash(cargo clippy:*)"
    # Safe against the task's own database only (see task_database).
    - "Bash(cargo run --bin wh:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
  # Every session gets a fresh worktree; one shared target dir keeps the compiled
  # dependencies between sessions instead of rebuilding the workspace from scratch
  # each stage. `wh cleanup` / the foreman wipe it above WH_CACHE_MAX_GB (30).
  env:
    CARGO_TARGET_DIR: ~/.cache/workhub/cargo-target

stages:
  - { id: spec, agent: spec, gate: spec-review }
  - { id: implement, agent: implementation }
  - { id: code_review, agent: code-review, on_reject: implement }

agents:
  spec:
    prompt: agents/spec.md
    budget_usd: 0.75
    timeout_min: 15
  implementation:
    prompt: agents/implementation.md
    budget_usd: 2.5
    timeout_min: 45
  code-review:
    prompt: agents/code-review.md
    budget_usd: 1.0
    timeout_min: 25
    # Reads and runs checks only.
    tools: [Bash, Read]

# LLM-as-judge quality checks (phase 4). Each grades finished sessions of its
# target agent with a cheap model and no tools; results feed /scorers and the
# improver. Scorer prompts are part of factory_version.
scorers:
  - id: scope-discipline
    target: implementation
    prompt: scorers/scope-discipline.md
    description: Changes stay within the task and spec; checks are not gamed
  - id: test-evidence
    target: implementation
    prompt: scorers/test-evidence.md
    description: Behaviour changes come with relevant tests that were run and reported honestly
  - id: review-evidence
    target: code-review
    prompt: scorers/review-evidence.md
    description: Review verdicts are consistent, evidenced with file:line, and actionable
    pass_threshold: 0.6

# Ship to GitHub (phase 8): after code_review, a human approves the push (ship-review),
# then WorkHub pushes wh/task/<id> and opens a PR. Failed CI or requested changes
# send the task back to implement. Issues labelled `workhub` become tasks.
github:
  repo: thaibhoang/WorkHub
  base: main
  ship_gate: ship-review
  # A PR that conflicts with main waits here; then WorkHub merges main and implement resolves.
  conflict_gate: conflict-review
  labels: [workhub]
  issues: { label: workhub, comment: true }

# Self-improvement (phase 5). The improver reads the metrics above, edits this
# directory on a `wh/proposal/<id>` branch and waits for a human in the Inbox.
# Runs on demand (`wh improve`, UI), on a trigger (once per factory_version) or
# on the schedule when there are new sessions.
improvement:
  prompt: improver/improver.md
  model: claude-opus-5-5
  budget_usd: 3.0
  timeout_min: 20
  window_days: 14
  min_sessions: 8
  interval_hours: 24
  max_open_proposals: 2
  triggers:
    - { metric: stage_failure_rate, stage: implement, above: 0.3 }
    - { metric: stage_reject_rate, stage: code_review, above: 0.5 }
    - { metric: scorer_fail_rate, scorer: test-evidence, above: 0.4 }
