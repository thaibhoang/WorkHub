# WorkHub's own factory (dogfooding). Edit prompts/policies here; every change
# produces a new factory_version so before/after metrics can be compared.
name: workhub-dev
repo: ..
base_ref: main
max_rework_loops: 3

defaults:
  model: claude-sonnet-5-5
  budget_usd: 2.0
  timeout_min: 30
  max_retries: 2
  permission_mode: acceptEdits
  allowed_tools:
    - "Bash(cargo build:*)"
    - "Bash(cargo test:*)"
    - "Bash(cargo clippy:*)"
    - "Bash(cargo fmt:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"

stages:
  - { id: triage, agent: triage }
  - { id: spec, agent: spec, gate: spec-review }
  - { id: implement, agent: implementation }
  - { id: code_review, agent: code-review, on_reject: implement }
  - { id: verify, agent: verify, on_reject: implement }

agents:
  triage:
    prompt: agents/triage.md
    model: claude-haiku-5-5
    budget_usd: 0.3
    timeout_min: 5
  spec:
    prompt: agents/spec.md
    budget_usd: 1.0
  implementation:
    prompt: agents/implementation.md
    budget_usd: 3.0
    timeout_min: 45
  code-review:
    prompt: agents/code-review.md
    budget_usd: 1.0
  verify:
    prompt: agents/verify.md
    budget_usd: 0.5
    timeout_min: 15

# LLM-as-judge quality checks (phase 4). Each grades finished sessions of its
# target agent with a cheap model and no tools; results feed /scorers and the
# improver. Scorer prompts are part of factory_version.
scorers:
  - id: scope-discipline
    target: implementation
    prompt: scorers/scope-discipline.md
    description: Changes stay within the task and spec; checks are not gamed
  - id: test-evidence
    target: implementation
    prompt: scorers/test-evidence.md
    description: Behaviour changes come with relevant tests that were run and reported honestly
  - id: review-evidence
    target: code-review
    prompt: scorers/review-evidence.md
    description: Review verdicts are consistent, evidenced with file:line, and actionable
    pass_threshold: 0.6
